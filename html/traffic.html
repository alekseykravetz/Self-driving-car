<!doctype html>
<html>

    <!-- Open Graph (LinkedIn, Facebook, Slack, WhatsApp, etc.) -->

      property="og:title"

    />
    <meta
      property="og:description"
      content="Drop trained cars on any map and watch a living, emergent traffic jam form one self-driving car at a time."
    />
    <meta
      property="og:url"
      content="https://celest-unity-3p3p.here.now/html/traffic.html"
    />
    <meta
      property="og:image"
      content="https://celest-unity-3p3p.here.now/assets/og-image.png"
    />
    <meta property="og:image:width" content="1200" />

      content="Self‑Driving Car Simulator — neuroevolution driving simulator"

      name="twitter:title"
      content="Live Traffic Jam — Self‑Driving Car Simulator"
    />

      name="twitter:description"
      content="Drop trained cars on any map and watch a living, emergent traffic jam form one self-driving car at a time."

      name="twitter:image"

    />
    <link rel="stylesheet" href="/styles/simulator.css" />

  <body>
    <div id="simulatorLayout">
      <canvas id="gameCanvas"></canvas>
      <canvas id="cameraCanvas"></canvas>
      <div id="rightPanel">
        <canvas id="networkCanvas"></canvas>
        <canvas id="miniMapCanvas"></canvas>
      </div>
      <traffic-panel></traffic-panel>
    </div>

    <div id="simulatorToolbar">
      <world-setup></world-setup>
      <layout-toolbar></layout-toolbar>
      <animation-loop-toolbar></animation-loop-toolbar>
      <world-layers-toolbar></world-layers-toolbar>
      <shortcuts-toolbar></shortcuts-toolbar>
    </div>

    <script type="module" src="/js/traffic/entry.js"></script>
  </body>
